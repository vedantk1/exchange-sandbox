name: Verify Spot Exchange Simulator

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI-only database. Deployed installations require authentication.
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/exchange_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration:external
      - run: pnpm build:web
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser:external
      - name: Build the self-host images
        run: |
          docker build --target api -t spot-exchange-simulator-api:ci .
          docker build --target web -t spot-exchange-simulator-web:ci .
          docker build --target operations -t spot-exchange-simulator-operations:ci .
      - name: Verify deployment asset routing over trusted HTTPS
        run: pnpm exec tsx scripts/deploy/verify-assets.ts spot-exchange-simulator-web:ci
      - name: Verify a fresh database restore with PostgreSQL 18 tools
        run: |
          mkdir -p .local/operations
          docker run --rm --network host --user "$(id -u):$(id -g)" -e DATABASE_URL="$TEST_DATABASE_URL" --mount type=bind,source="$PWD/.local/operations",target=/app/.local/operations spot-exchange-simulator-operations:ci
      - name: Upload the verified restore report
        uses: actions/upload-artifact@v4
        if: success()
        with:
          name: operational-verification-reports
          path: .local/operations/restore-result.json
          # This exact report is sanitized; other private .local files stay excluded.
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: output/playwright/ci/
          retention-days: 7
