name: Verify exchange sandbox

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: exchange_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d exchange_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Ephemeral CI-only database. Deployed installations require authentication.
      TEST_DATABASE_URL: postgresql://postgres@localhost:5432/exchange_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm format:check
      - run: pnpm test
      - run: pnpm test:integration:external
      - run: pnpm build:web
